[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "realesrgan-http-api"
version = "0.0.1"
description = "HTTP API for Real-ESRGAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.13.0",
  "click==8.3.1",
  "fastapi==0.135.2",
  "h11==0.16.0",
  "idna==3.11",
  "pydantic==2.12.5",
  "pydantic_core==2.41.5",
  "starlette==1.0.0",
  "typing-inspection==0.4.2",
  "typing_extensions==4.15.0",
  "uvicorn==0.42.0",
]

[project.scripts]
realesrgan-http-api = "realesrgan_http_api.__main__:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
